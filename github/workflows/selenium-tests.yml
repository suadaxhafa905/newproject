name: Selenium Automation Tests

on:
  push:
    branches: [ main, test ]

  pull_request:
    branches: [ main, test ]

  workflow_dispatch:

jobs:

  run-tests:

    runs-on: windows-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '22'

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.15

      - name: Run Selenium Tests
        run: mvn clean test -Ptest

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-reports
          path: |
            reports/**
            target/allure-results/**
            target/cucumberReports/**